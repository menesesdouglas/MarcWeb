<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário | MarcWeb</title>
    <link rel="stylesheet" href="css/custom-styles.css">
    <link rel="stylesheet" href="css/custom-styles_profile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols" />
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">Marc<span>Web</span></div>
            <div class="nav-links">


                <a href="employee.html">
                    <i class="material-symbols">Dataset</i>
                    <span>Ponto</span>
                </a>


                <a href="history.html" class="active">
                    <i class="material-symbols">History</i>
                    <span>Histórico</span>
                </a>


                <a href="#" id="btnLogout">
                    <i class="material-symbols">logout</i>
                    <span>Sair</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="dashboard-container">
        <section class="profile-header">
            <div class="profile-avatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <div class="profile-info">
                <h1 id="userName">Nome do Usuário</h1>
                <p id="userRole">Cargo</p>
                <p id="userUsername">Usuário: username</p>
            </div>
        </section>

        <div class="profile-grid">
            <section class="profile-card">
                <h3>Informações Pessoais</h3>
                <form id="profileForm">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="form-group">
                        <label>Nome de Usuário</label>
                        <input type="text" id="username" readonly>
                    </div>
                    <div class="form-group">
                        <label>Cargo</label>
                        <input type="text" id="role" readonly>
                    </div>
                    <div class="form-group">
                        <label>Senha Atual</label>
                        <input type="password" id="currentPassword">
                    </div>
                    <div class="form-group">
                        <label>Nova Senha</label>
                        <input type="password" id="newPassword">
                    </div>
                    <div class="form-group">
                        <label>Confirmar Nova Senha</label>
                        <input type="password" id="confirmPassword">
                    </div>
                    <div class="btn-container">
                        <button type="submit" class="btn-primary">Atualizar Perfil</button>
                    </div>
                </form>
            </section>

            <section class="profile-card">
                <h3>Minhas Folgas</h3>
                <div id="folgasList" class="folgas-container">
                    <p>Carregando folgas...</p>
                </div>
                <div class="btn-container">
                    <button class="btn-secondary" onclick="openFolgaModal()">Solicitar Folga</button>
                </div>
            </section>

            <section class="profile-card">
                <h3>Atividades Recentes</h3>
                <div id="recentActivity" class="activity-list">
                    <p>Carregando atividades...</p>
                </div>
            </section>
        </div>
    </main>

    <!-- Modal para solicitar folga -->
    <div id="folgaModal" class="modal">
        <div class="modal-content">
            <h3>Solicitar Folga</h3>
            <form id="folgaForm">
                <div class="form-group">
                    <label>Tipo de Folga</label>
                    <select id="tipoFolga" required>
                        <option value="FERIAS">Férias</option>
                        <option value="ATESTADO">Atestado Médico</option>
                        <option value="FALTA_JUSTIFICADA">Falta Justificada</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Data Inicial</label>
                    <input type="date" id="dataInicio" required>
                </div>
                <div class="form-group">
                    <label>Data Final</label>
                    <input type="date" id="dataFim" required>
                </div>
                <div class="form-group">
                    <label>Justificativa</label>
                    <textarea id="justificativa" rows="3" placeholder="Descreva o motivo da folga..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" onclick="closeFolgaModal()" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Solicitar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/script_profile.js"></script>
</body>

</html>
