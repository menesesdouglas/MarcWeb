<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Registros | MarcWeb</title>
    <link rel="stylesheet" href="css/custom-styles.css">
    <link rel="stylesheet" href="css/custom-styles_history.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols" />
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">Marc<span>Web</span></div>
            <div class="nav-links">


                <a href="employee.html">
                    <i class="material-symbols">Dataset</i>
                    <span>Ponto</span>
                </a>



                <a href="profile.html">
                    <i class="material-symbols">person</i>
                    <span>Perfil</span>
                </a>



                <a style="color: rgb(181, 1, 1);"  href="#" id="btnLogout" >
                    <i class="material-symbols">Redo</i>
                    <span>Sair</span>
                </a>

            </div>
        </div>
    </nav>

    <main class="dashboard-container">
        <section  class="history-header">
            <h1>Histórico de Registros</h1>
            <p>Visualize todos os seus registros de ponto por período</p>
        </section>

        <section class="filters-section">
            <div class="filter-card">
                <h3>Filtros</h3>
                <div class="filter-grid">
                    <div class="filter-group">
                        <label>Mês-Ano</label>
                        <input type="month" id="mesAno" value="2025-08">
                    </div>
                    <div class="filter-actions">
                        <button class="btn-primary" onclick="carregarHistorico()">Carregar Dados</button>
                        <button class="btn-secondary" onclick="exportarPDF()">Exportar PDF</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="summary-section">
            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="summary-content">
                        <h4>Total de Horas</h4>
                        <p id="totalHoras">--:--</p>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon">
                        <i class="fas fa-calendar-day"></i>
                    </div>
                    <div class="summary-content">
                        <h4>Dias Trabalhados</h4>
                        <p id="diasTrabalhados">--</p>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon">
                        <i class="fas fa-plus-circle"></i>
                    </div>
                    <div class="summary-content">
                        <h4>Horas Extras</h4>
                        <p id="horasExtras">--:--</p>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon">
                        <i class="fas fa-minus-circle"></i>
                    </div>
                    <div class="summary-content">
                        <h4>Horas Débito</h4>
                        <p id="horasDebito">--:--</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script src="js/script_history.js"></script>
</body>

</html>
