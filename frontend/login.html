<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MarcWeb - Sistema de Ponto</title>
    <link rel="icon" type="image/x-icon" href="image/favicon.ico">
    <link rel="stylesheet" href="css/custom-styles_login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"> 
</head>

<body>

    <div class="login-container">
        <div class="login-box reveal">
            <header>
                <div class="logo">Marc<span>Web</span></div>
                <p>Acesse o painel de controle</p>
            </header>

            <form id="loginForm">
                <div class="input-group">
                    <label for="company">Empresa</label>
                    <div class="select-wrapper">
                        <select id="company" required>
                        </select>
                        <div class="select-icon">▼</div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="username">Usuário ou E-mail</label>
                    <input type="text" id="username" placeholder="Digite seu usuário" value="" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" value="" id="password" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" id="togglePassword" class="eye-btn">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn-login">Entrar no Sistema</button>
            </form>

            <footer>
                <p>Ainda não é cliente? <a href="index.html">Solicite um orçamento</a></p>
            </footer>
        </div>
    </div>

    <div class="bg-decoration">
        <div class="blob"></div>
    </div>

    <script src="js/script_login.js"></script>
</body>

</html>
