<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Marc Web</title>
    <!-- Carrega o Pico CSS via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Carrega o CSS customizado para aplicar a paleta de cores -->
    <link rel="stylesheet" href="css/custom-styles.css">
    <!-- Favicon opcional -->
    <!-- <link rel="icon" href="path/to/favicon.ico"> -->
</head>

<body>
    <main class="container">
        <!-- Cabeçalho -->
        <header class="text-center">
            <hgroup>
                <h1>Marc Web</h1>
                <p>Sistema de Ponto Eletrônico</p>
            </hgroup>
        </header>

        <!-- Seção Principal do Formulário -->
        <section class="grid">
            <!-- Espaçador (opcional, para centralização visual em telas maiores) -->
            <div></div>

            <article>
                <h2>Entrar</h2>

                <!-- Formulário de Login -->
                <form id="loginForm">
                    <fieldset>
                        <label for="username">
                            <abbr title="Nome de Usuário ou E-mail">Usuário</abbr>
                        </label>
                        <input type="text" id="username" name="username" placeholder="Digite seu usuário" required>

                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>

                        <!-- Placeholder para mensagem de erro (exemplo) -->
                        <!-- <div class="toast error">Usuário ou senha inválidos.</div> -->

                        <button type="submit" class="contrast">Entrar</button>
                    </fieldset>
                </form>

                <!-- Links Secundários -->
                <small>
                    <a href="#">Esqueci minha senha</a> |
                    <a href="register.html">Registrar</a>
                </small>

            </article>

            <!-- Espaçador (opcional) -->
            <div></div>
        </section>
    </main>

    <!-- Script JS opcional (não necessário para design puro) -->
    <!-- <script src="js/login.js"></script> -->
</body>

</html>
