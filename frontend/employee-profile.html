<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Perfil do Usuário</title>
    <link rel="stylesheet" href="css/custom-styles_employee-profile.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols" />
</head>

<body onload="loadPage()" id="body">

    <main class="container">
        <div class="profile">
            <div class="photo"></div>
            <div>
                <h2 id="nome"></h2>
                <span id="cargo"></span><br><br>
                <label for="modal-cadastro" class="btn">Nova Folga</label>
            </div>
        </div>

        <h3>Folgas</h3>
        <table id="table-folgas">
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Tipo</th>
                    <th>Início</th>
                    <th>Fim</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

    </main>


    <input type="checkbox" id="modal-cadastro">
    <div class="modal modal-cadastro">
        <div class="modal-content">
            <label for="modal-cadastro" class="close material-symbols">close</label>
            <h3 style="text-align: center;">Nova Folga</h3>
            <form onsubmit="cadastrarFolga()" id="form-new-folga">

                <div class="input-group">
                    <label for="tipo">Tipo:</label>
                    <select id="tipo" class="form-new-folga">
                        <option value="FERIAS">Ferias</option>
                        <option value="ATESTADO">Atestado</option>
                        <option value="FALTA_JUSTIFICADA">Falta justificada</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="data-inicio">Data Início:</label>
                    <input required id="data-inicio" class="form-new-folga" type="date">

                </div>
                <div class="input-group">

                    <label for="data-fim">Data Fim:</label>
                    <input required id="data-fim" class="form-new-folga" type="date">
                </div>

                <div class="input-group">

                    <label for="justificativa"> Justificativa:</label>
                    <textarea minlength="20" maxlength="500" required style="height: 100px;" id="justificativa"
                        class="form-new-folga"></textarea>
                    <button type="submit" style="margin-top: 50px; height: 40px;" class="btn">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>


    <div id="modal-folga" class="modal modal-detalhes">

        <div id="modal-detalhes-content" class="modal-content">
            <label id="closeModal-folga" class="close material-symbols">close</label>
            <h3>Detalhes da Folga</h3>
            <label>Funcionário:</label>
            <p id="nome-user"> João da Silva</p>
            <label>Tipo:</label>
            <p id="tipo-folga"> Folga</p>
            <label>Início:</label>
            <p id="inicio-folga">01/07/2025</p>
            <label>Fim:</label>
            <p id="fim-folga"> 02/07/2025</p>
            <b>Status:</b>
            <p id="status-folga"> </p>
            <b>Justificativa:</b>
            <p id="justificativa-info"> </p>
            <div id="buttons">

            </div>
        </div>
    </div>

    <script src="js/script_employee_profile.js"></script>
</body>

</html>
