<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar - Marc Web</title>
    <!-- Carrega o Pico CSS via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Carrega o CSS customizado para aplicar a paleta de cores -->
    <link rel="stylesheet" href="css/custom-styles.css">
    <!-- Favicon opcional -->
    <!-- <link rel="icon" href="path/to/favicon.ico"> -->
</head>

<body>
    <main class="container">
        <!-- Cabeçalho -->
        <header class="text-center">
            <hgroup>
                <h1>Marc Web</h1>
                <p>Sistema de Ponto Eletrônico</p>
            </hgroup>
        </header>

        <!-- Seção Principal do Formulário -->
        <section class="grid">
            <!-- Espaçador (opcional) -->
            <div></div>

            <article>
                <h2>Criar Conta</h2>

                <!-- Formulário de Registro -->
                <form id="registerForm">
                    <fieldset>
                        <label for="nome">
                            Nome Completo
                        </label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

                        <label for="username">
                            <abbr title="Nome de Usuário">Usuário</abbr>
                        </label>
                        <input type="text" id="username" name="username" placeholder="Digite um nome de usuário" required>

                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>

                        <label for="confirmPassword">Confirmar Senha</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>

                        <!-- Campo de Role (opcional para design, pode ser oculto ou fixo no backend) -->
                        <!-- <label for="role">Tipo de Conta</label>
                        <select id="role" name="role">
                            <option value="EMPLOYEE">Funcionário</option>
                            <option value="ADMIN">Administrador</option>
                        </select> -->

                        <!-- Placeholder para mensagem de erro/sucesso (exemplo) -->
                        <!-- <div class="toast error">As senhas não coincidem.</div> -->
                        <!-- <div class="toast success">Conta criada com sucesso!</div> -->

                        <button type="submit" class="contrast">Cadastrar</button>
                    </fieldset>
                </form>

                <!-- Link Secundário -->
                <small>
                    <a href="login.html">Já tem uma conta? Faça login</a>
                </small>

            </article>

            <!-- Espaçador (opcional) -->
            <div></div>
        </section>
    </main>

    <!-- Script JS opcional (não necessário para design puro) -->
    <!-- <script src="js/register.js"></script> -->
</body>

</html>
