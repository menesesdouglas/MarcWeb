version: "3.9"

services:
  # -------------------------------------------------------------------------
  # Banco de dados PostgreSQL
  # -------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: repp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: repp
      POSTGRES_USER: repp
      POSTGRES_PASSWORD: repp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repp -d repp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - repp_net

  # -------------------------------------------------------------------------
  # Backend FastAPI
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repp_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://repp:repp_password@db:5432/repp
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      FRONTEND_URL: http://localhost:5173
      BACKEND_CORS_ORIGINS: http://localhost:5173
      BACKEND_PORT: 8000
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - repp_net

  # -------------------------------------------------------------------------
  # Frontend React (Vite)
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - repp_net

networks:
  repp_net:
    driver: bridge

volumes:
  postgres_data: