spring:
  datasource:
    url: ${DB_URL_PROD}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}   # Configure via variável de ambiente
    driver-class-name: org.postgresql.Driver
    # Configurações do HikariCP (pool de conexões)
    hikari:
      # Tempo máximo que uma conexão pode ficar ociosa (minutos)
      idle-timeout: 600000
      # Tempo máximo de vida de uma conexão (minutos)
      max-lifetime: 1800000
      # Tempo máximo de espera por uma conexão do pool (milissegundos)
      connection-timeout: 20000
      # Tamanho máximo do pool
      maximum-pool-size: 20
      # Tamanho mínimo do pool
      minimum-idle: 5
      # Nome do pool (para logs)
      pool-name: MarcWeb-HikariCP
      # Validação de conexão
      connection-test-query: SELECT 1
      # Registrar conexões abandonadas
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate # Importante: validar contra o schema do Flyway
    show-sql: false # Útil para debug em dev
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Timeouts do Hibernate
        jdbc:
          time_zone: America/Sao_Paulo
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false # Desativar para evitar problemas de lazy loading
  sql:
    init:
      mode: never # Desativar inicialização automática do schema
  flyway:
    enabled: true # Habilitar Flyway
    locations: classpath:db/migration
    baseline-on-migrate: true # Criar schema_history se não existir

application:
  security:
    jwt:
      # Chave secreta para assinar os tokens JWT - Lida do arquivo .env ou variável de ambiente
      secret-key: ${JWT_SECRET}
      # Identificador da chave atual (kid) — usado para rotação de chaves (ex: key-2026-01)
      kid: ${APPLICATION_SECURITY_JWT_KID:default}
      # Chaves anteriores no formato id:base64key,id2:base64key2 — usadas para validar tokens assinados com chaves antigas
      previous-keys: ${APPLICATION_SECURITY_JWT_PREVIOUS_KEYS:}
      # Tempo de expiração do token em milissegundos (8 horas = 8 * 60 * 60 * 1000)
      expiration: 28800000

server:
  port: 8080
  ssl:
    enabled: ${SSL_ENABLED:true} # Ativado em prod por padrão
    key-store: classpath:keystore.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: marcweb
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3
    cipher-suites: TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_DHE_RSA_WITH_AES_256_GCM_SHA384
