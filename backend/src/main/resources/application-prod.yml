spring:
  datasource:
    url: ${DB_URL_PROD}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}   # Configure via variável de ambiente
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Importante: validar contra o schema do Flyway
    show-sql: false # Útil para debug em dev
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never # Desativar inicialização automática do schema
  flyway:
    enabled: true # Habilitar Flyway
    locations: classpath:db/migration
    baseline-on-migrate: true # Criar schema_history se não existir

application:
  security:
    jwt:
      # Chave secreta para assinar os tokens JWT - Lida do arquivo .env ou variável de ambiente
      secret-key: ${JWT_SECRET}
      # Identificador da chave atual (kid) — usado para rotação de chaves (ex: key-2026-01)
      kid: ${APPLICATION_SECURITY_JWT_KID:default}
      # Chaves anteriores no formato id:base64key,id2:base64key2 — usadas para validar tokens assinados com chaves antigas
      previous-keys: ${APPLICATION_SECURITY_JWT_PREVIOUS_KEYS:}
      # Tempo de expiração do token em milissegundos (8 horas = 8 * 60 * 60 * 1000)
      expiration: 28800000

server:
  port: 8080
  ssl:
    enabled: ${SSL_ENABLED:true} # Ativado em prod por padrão
    key-store: classpath:keystore.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: marcweb
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3
    cipher-suites: TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_DHE_RSA_WITH_AES_256_GCM_SHA384