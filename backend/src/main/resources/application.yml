spring:
  profiles:
    active: dev # Define o perfil ativo padrão (pode ser sobrescrito)
  application:
    name: marc-web
  jpa:
    hibernate:
      ddl-auto: validate # Importante: validar contra o schema real (Flyway depois)
    show-sql: false # Mantenha falso em dev também, a menos que precise debugar
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Configurações de timeout do Hibernate
        jdbc:
          time_zone: America/Sao_Paulo
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # Importante: desativar para evitar problemas de lazy loading e N+1 queries
    open-in-view: false
  sql:
    init:
      mode: never # Não rodar scripts iniciais do Spring, usar Flyway

server:
  port: 8080

logging:
  level:
    com.marcweb: DEBUG # Nível de log para pacotes do projeto
    org.springframework.security: DEBUG # Nível de log para segurança (ajustar se necessário)
    # Níveis do HikariCP para monitoramento
    com.zaxxer.hikari: DEBUG
