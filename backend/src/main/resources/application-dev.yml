spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/marcweb_dev
    username: marcuser
    password: salfsa # Substitua pela senha real definida nas configurações
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Importante: validar contra o schema do Flyway futuramente
    show-sql: true # Útil para debug em dev
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never # Desativar inicialização automática do schema
  flyway:
    enabled: true # Habilitar Flyway
    locations: classpath:db/migration
    baseline-on-migrate: true # Criar schema_history se não existir

application:
  security:
    jwt:
      # Chave secreta para assinar os tokens JWT - SUBSTITUA POR UMA CHAVE SEGURO E SECRETA EM PROD!
      # Exemplo gerado com: openssl rand -base64 64
      secret-key: 
      # Tempo de expiração do token em milissegundos (8 horas = 8 * 60 * 60 * 1000)
      expiration: 28800000

server:
  port: 8080