spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/marcweb_dev
    username: marcuser
    password: salfsa # Substitua pela senha definida no passo 1
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Validar contra o schema existente (ou criar se não existir via Flyway depois)
    show-sql: true # Mostrar SQL no console em DEV
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    # baseline-version: 1
    # baseline-description: << Flyway Baseline >>
server:
  port: 8080 # Porta padrão, pode ser sobrescrita
logging:
  level:
    com.marcweb: DEBUG
    org.springframework.security: DEBUG